name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: Commands you ran and their output}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "GPU, driver, OS, Newton/Warp version, browser"}
