<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Props Sandbox</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --panel: rgba(24, 26, 28, 0.86);
    --fg: #ecebe6;
    --muted: #a3a6a8;
    --accent: #f2b43a;
    --line: rgba(255, 255, 255, 0.12);
    --ok: #7fcf8d;
    --bad: #f19a90;
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c4cc; color: var(--fg); font: 13px/1.45 var(--font); }
  canvas { display: block; }
  #panel {
    position: absolute; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .stats { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-family: var(--mono); font-size: 12px; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: 600 12px var(--font); color: #1d2023; background: var(--accent); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  #status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #status.error { color: var(--bad); }
  fieldset.machine { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px 10px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  fieldset.machine legend { color: var(--accent); font-weight: 600; padding: 0 4px; }
  fieldset.machine label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  fieldset.machine output { color: var(--fg); font-family: var(--mono); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .gauge { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .gauge > div { height: 100%; width: 0; background: var(--ok); transition: width 0.1s; }
  .gauge > div.high { background: var(--accent); }
  .gauge > div.relief { background: var(--bad); }
  .stall { color: var(--bad); }
  footer { color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; }
  footer a { color: var(--accent); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1>Site props sandbox <span>· Phase 1</span></h1>
  <div id="status">Loading…</div>
  <dl class="stats" id="stats"></dl>
  <div class="buttons">
    <button id="btn-drop">Drop 6 crates</button>
    <button id="btn-beam">Drop steel beam</button>
    <button id="btn-hulls" class="secondary">Show colliders</button>
    <button id="btn-reset" class="secondary">Reset</button>
  </div>
  <fieldset class="machine">
    <legend>Pallet stacker</legend>
    <label for="ctl-fork">Fork height <output id="ctl-fork-out">0.00 m</output></label>
    <input id="ctl-fork" type="range" min="0" max="1.5" step="0.01" value="0">
    <label for="ctl-steer">Steering <output id="ctl-steer-out">0°</output></label>
    <input id="ctl-steer" type="range" min="-60" max="60" step="1" value="0">
    <div class="buttons"><button id="ctl-rev" class="secondary">◀ Reverse (hold)</button><button id="ctl-fwd" class="secondary">Forward (hold) ▶</button></div>
  </fieldset>
  <fieldset class="machine">
    <legend>Vehicle lift</legend>
    <label for="ctl-ramp">Ramp angle <output id="ctl-ramp-out">0°</output></label>
    <input id="ctl-ramp" type="range" min="0" max="39" step="1" value="0">
  </fieldset>
  <p class="hint">Click any object to push it. Drag to orbit, scroll to zoom.</p>
  <details>
    <summary>Masses used (kg)</summary>
    <table id="masses"><thead><tr><th>Asset</th><th class="num">USD</th><th class="num">GLB</th><th class="num">Used</th></tr></thead><tbody></tbody></table>
  </details>
  <footer>Models: <a href="https://huggingface.co/datasets/nvidia/simready-assets" target="_blank" rel="noopener">NVIDIA SimReady</a>, CC BY 4.0, converted to GLB by <a href="https://huggingface.co/datasets/codepawl/simready-glb" target="_blank" rel="noopener">codepawl</a>. Masses changed to catalogue values. Physics: <a href="https://github.com/jrouwe/JoltPhysics.js" target="_blank" rel="noopener">Jolt</a>.</footer>
</div>
<script type="module" src="site.js"></script>
</body>
</html>
